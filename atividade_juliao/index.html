<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etinuaigosnobiagudnaiti</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>1</h1>
    <p id="elementId">Olá, mundo</p>
    <button onclick="mudar()">mudar</button>
    
    <h1>2</h1>
    <button onclick="mudar_cor1()">azul</button>
    <button onclick="mudar_cor2()">verde</button>
    <button onclick="mudar_cor3()">vermelho</button>

    <h1>3</h1>
    <div class="caixa" id="caixa"></div>
    <button onclick="coisar()" id="coisar">Esconder</button>

    <h1>4</h1>
    <p id="valorContador">0</p>
    <button onclick="aumentar()">+1</button>
    <button onclick="zerar()">Zerar</button>

    <h1>5</h1>
    <input type="text" id="meuInput" placeholder="Digite algo...">
    <button onclick="mostrarTexto()">Mostrar</button>
    <p id="resultadoInput"></p>

    <h1>6</h1>
    <input type="text" id="inputLista" placeholder="Novo item...">
    <button onclick="adicionarItem()">Adicionar</button>
    <ul id="minhaLista"></ul>

    <h1>7</h1>
    <h2 id="tituloTamanho">Texto que muda de tamanho</h2>
    <button onclick="mudarTamanho(1)">A+</button>
    <button onclick="mudarTamanho(-1)">A-</button>

    <h1>8</h1>
    <img id="minhaImagem" src="https://external-content.duckduckgo.com/iu/?u=http%3A%2F%2Fs2.glbimg.com%2FJAVlJxSLFkERi_TcjZeyp8WrBX0%3D%2Fs.glbimg.com%2Fet%2Fpr%2Ff%2Foriginal%2F2013%2F05%2F22%2Frr2.jpg&f=1&nofb=1&ipt=0c4a62f738f8a2baee9790dc31b792745fc8feade295fac92b27e53cca6e5445" alt="" width="300">
    <button onclick="trocarImagem()">Trocar Imagem</button>

    <h1>9</h1>
    <input type="text" id="nomeValidacao" placeholder="Seu nome">
    <button onclick="validarForm()">Enviar</button>
    <p id="msgValidacao"></p>

    <h1>10</h1>
    <button id="btnDark" onclick="toggleDark()">Modo Escuro</button>

    <script src="script.js"></script>
</body>
</html>
